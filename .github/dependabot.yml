version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      # vite-plus は vite の別名と vitest を同じ版に揃える前提なので、関係する版を1つの PR にまとめる
      vite-plus:
        patterns:
          - vite-plus
          - vitest
          - '@vitest/*'
          - '@voidzero-dev/*'
      # react と react-dom は版が完全に一致しないと起動しない
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      # applies-to を省いた group は版更新にしか効かないので、脆弱性対応の PR にも同じまとまりを定義する
      vite-plus-security:
        applies-to: security-updates
        patterns:
          - vite-plus
          - vitest
          - '@vitest/*'
          - '@voidzero-dev/*'
      react-security:
        applies-to: security-updates
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
